server {
    listen 80;
    server_name  ${DOMAIN};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl http2;
    server_name  ${DOMAIN};
    ssl_certificate     /etc/ssl/origin/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/ssl/origin/${DOMAIN}/privkey.pem;
    include      snippets/ssl.conf;

    location / {

        index  index.html;
        include     snippets/proxy.conf;
        return try_files $uri $uri/ =404;
    }

    location /line-bot {
        include     snippets/proxy.conf;
        proxy_pass  http://${PRIVATE_IP}/{ROUTE};
    }
}